name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: ruff · mypy · pytest · selftest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev tools
        run: pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy src/sentry

      - name: Test (pytest)
        run: pytest -q

      - name: Offline selftest (replay exit gate)
        run: python -m sentry selftest